# Local development URL; set the production domain when it is available.
baseURL = 'http://localhost:1313'
languageCode = 'en-US'
title = 'Katia Sommers | Author'
defaultContentLanguage = 'en'
enableRobotsTXT = true
theme = 'Magnolia'
googleAnalytics = ''
disableKinds = ['taxonomy', 'term']

[params.robots]
  blockAIcrawlers = false

[module]
  [[module.mounts]]
    source = 'node_modules/bootstrap/dist/js/bootstrap.bundle.min.js'
    target = 'assets/js/bootstrap.bundle.min.js'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [module.hugoVersion]
    extended = true
    min = '0.150.0'

[markup.goldmark.renderer]
  unsafe = true

[security]
  allowContent = ['^text/html$', '^text/markdown$']

[security.node]
  allowRead = ['.', 'node_modules']
